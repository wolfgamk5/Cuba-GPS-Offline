name: Generar mapa y rutas de Cuba

# Manual, desde la pestaña "Actions" > este workflow > "Run workflow". Hace en la nube todo
# lo que normalmente pedía una PC potente: descarga el mapa de OpenStreetMap de Cuba,
# genera el mapa 3D (cuba.mbtiles) y las rutas reales (graph-cache), y los publica como
# adjuntos de un "Release" de GitHub — con eso ya tienes URLs de descarga directa listas
# para pegar en download.properties (Fase 3 de SETUP_MAPA_OFFLINE.md).
#
# Tarda varios minutos. Cuba es un país pequeño en datos de OSM (~60 MB el .osm.pbf), así
# que entra sin problema en la memoria de los runners gratuitos de GitHub (7 GB de RAM).
on:
  workflow_dispatch:

permissions:
  contents: write # necesario para poder publicar el Release al final

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar datos de OpenStreetMap de Cuba (Geofabrik)
        run: wget -q -O cuba-latest.osm.pbf https://download.geofabrik.de/central-america/cuba-latest.osm.pbf

      - name: Descargar Planetiler
        run: wget -q -O planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      # Descargamos nosotros mismos los 3 archivos auxiliares que Planetiler necesita
      # (líneas de costa, polígonos de agua, límites de países), con reintentos y más
      # tiempo de espera — el --download interno de Planetiler usa un timeout muy corto
      # (30s) y el servidor de water-polygons a veces tarda más que eso en responder.
      - name: Descargar recursos auxiliares de Planetiler
        run: |
          mkdir -p data/sources
          wget --tries=5 --timeout=90 -q -O data/sources/natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
          wget --tries=5 --timeout=90 -q -O data/sources/lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/download/v12/lake_centerline.shp.zip
          wget --tries=5 --timeout=90 -q -O data/sources/water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip

      - name: Generar cuba.mbtiles (mapa 3D)
        # Sin --download: como ya dejamos los 3 archivos auxiliares en data/sources/,
        # Planetiler los usa directamente en vez de intentar descargarlos de nuevo.
        run: java -Xmx6g -jar planetiler.jar --osm-path=cuba-latest.osm.pbf --output=cuba.mbtiles --force

      - name: Descargar GraphHopper
        run: wget -q -O graphhopper-web.jar https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/10.2/graphhopper-web-10.2.jar

      - name: Crear configuración de GraphHopper
        run: |
          cat > gh-config.yml << 'EOF'
          graphhopper:
            datareader.file: cuba-latest.osm.pbf
            graph.location: graph-cache
            import.osm.ignored_highways: proposed,construction,platform,raceway
            graph.encoded_values: car_access, car_average_speed
            profiles:
              - name: car
                custom_model:
                  priority:
                    - if: "!car_access"
                      multiply_by: "0"
                  speed:
                    - if: "true"
                      limit_to: "car_average_speed"
                  distance_influence: 200
          EOF

      - name: Generar graph-cache (rutas reales calle por calle)
        run: java -Xmx6g -jar graphhopper-web.jar import gh-config.yml

      - name: Comprimir graph-cache
        run: zip -rq graph-cache.zip graph-cache

      - name: Instalar osmium-tool (extracción de puntos de interés)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Filtrar solo elementos con etiquetas de POI
        # De todo el .osm.pbf nos quedamos solo con nodos/vías/relaciones que tengan alguna
        # de estas etiquetas (hospitales, gasolineras, hoteles, restaurantes, etc.) — reduce
        # muchísimo el tamaño antes de procesar.
        run: |
          osmium tags-filter -o pois-raw.pbf cuba-latest.osm.pbf \
            nwr/amenity nwr/shop=car_repair nwr/tourism nwr/healthcare \
            nwr/office=financial nwr/craft=car_repair

      - name: Exportar POIs a GeoJSON (con centroide para edificios/áreas)
        run: osmium export pois-raw.pbf -o pois.geojson --geometry-types=point -f geojson --overwrite

      - name: Convertir a base de datos SQLite para búsqueda en la app
        run: |
          cat > build_pois_db.py << 'PYEOF'
          import json, sqlite3, sys

          # Mapeo de etiquetas de OpenStreetMap a las categorías que ya usa la app
          # (com.example.data.PoiCategory) — el nombre debe coincidir exactamente.
          def map_category(tags):
              amenity = tags.get("amenity", "")
              shop = tags.get("shop", "")
              tourism = tags.get("tourism", "")
              healthcare = tags.get("healthcare", "")
              craft = tags.get("craft", "")
              office = tags.get("office", "")
              if amenity == "fuel":
                  return "GASOLINERA"
              if amenity in ("hospital", "clinic", "doctors") or healthcare:
                  return "HOSPITAL"
              if tourism in ("hotel", "guest_house", "hostel", "motel", "camp_site", "chalet"):
                  return "HOTEL_CAMPISMO"
              if shop == "car_repair" or craft == "car_repair" or amenity == "car_wash":
                  return "TALLER_PONCHERA"
              if amenity == "pharmacy":
                  return "FARMACIA"
              if amenity in ("bus_station", "ferry_terminal"):
                  return "TRANSPORTE"
              if tourism in ("attraction", "museum", "viewpoint", "gallery", "artwork", "zoo"):
                  return "TURISMO"
              if amenity == "bank" or amenity == "atm" or office == "financial":
                  return "BANCO_CAJERO"
              if amenity in ("restaurant", "cafe", "fast_food", "bar", "pub", "food_court"):
                  return "GASTRONOMIA"
              return None

          con = sqlite3.connect("pois.sqlite")
          cur = con.cursor()
          cur.execute("""
              CREATE TABLE poi (
                  id INTEGER PRIMARY KEY,
                  name TEXT NOT NULL,
                  category TEXT NOT NULL,
                  lat REAL NOT NULL,
                  lon REAL NOT NULL,
                  address TEXT NOT NULL DEFAULT ''
              )
          """)
          cur.execute("CREATE INDEX idx_poi_name ON poi(name COLLATE NOCASE)")
          cur.execute("CREATE INDEX idx_poi_category ON poi(category)")

          count = 0
          with open("pois.geojson", encoding="utf-8") as f:
              data = json.load(f)

          rows = []
          for feature in data.get("features", []):
              tags = feature.get("properties", {}) or {}
              name = tags.get("name")
              if not name:
                  continue
              category = map_category(tags)
              if category is None:
                  continue
              geom = feature.get("geometry") or {}
              coords = geom.get("coordinates")
              if not coords or len(coords) != 2:
                  continue
              lon, lat = coords[0], coords[1]
              addr_parts = [tags.get("addr:street", ""), tags.get("addr:city", "")]
              address = ", ".join(p for p in addr_parts if p)
              rows.append((name, category, lat, lon, address))

          cur.executemany(
              "INSERT INTO poi (name, category, lat, lon, address) VALUES (?, ?, ?, ?, ?)",
              rows
          )
          con.commit()
          con.close()
          print(f"POIs guardados: {len(rows)}")
          PYEOF
          python3 build_pois_db.py

      - name: Publicar como Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mapa-cuba-${{ github.run_number }}
          name: Mapa y rutas de Cuba (generado automáticamente)
          files: |
            cuba.mbtiles
            graph-cache.zip
            pois.sqlite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
